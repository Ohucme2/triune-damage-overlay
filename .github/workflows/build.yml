name: Build

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Build
        run: dotnet build src/TriuneDamageOverlay/TriuneDamageOverlay.csproj -c Release
      - name: Parser checks
        run: dotnet run --project tests/TriuneDamageOverlay.SelfTest/TriuneDamageOverlay.SelfTest.csproj -c Release
      - name: Package Windows application
        run: dotnet publish src/TriuneDamageOverlay/TriuneDamageOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: TRIUNE-Damage-Overlay-Windows-x64
          path: publish/TriuneDamageOverlay.exe

